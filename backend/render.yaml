services:
  - type: web
    name: afrikcse-afrikvoyage
    runtime: image
    region: frankfurt
    plan: free

    # Image construite et poussée par .github/workflows/deploy.yml (job
    # build-and-push-backend) à chaque push sur main. Render re-tire le tag
    # `latest` quand le Deploy Hook est appelé (job deploy-backend).
    #
    # ⚠️ Bascule d'un service existant de runtime "node" vers "image" :
    # à faire une première fois manuellement dans le Dashboard Render
    # (Settings → le sync Blueprint ne migre pas toujours le runtime tout seul).
    # ⚠️ Si le package GHCR est privé, ajouter les identifiants du registre dans
    # Render Dashboard → Account Settings → Credentials (PAT GitHub, scope
    # read:packages), ou rendre le package public dans les settings du package
    # sur GitHub.
    image:
      url: ghcr.io/thierry-tchonkloe/afrikcse-afrikvoyage-backend:latest

    # La migration Prisma (prisma migrate deploy) et le démarrage du serveur
    # sont désormais gérés par le ENTRYPOINT de l'image (docker-entrypoint.sh).

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: afrikcse-afrikvoyage
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TICKET_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PORT
        value: 10000
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: KKIAPAY_PUBLIC_KEY
        sync: false
      - key: KKIAPAY_PRIVATE_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false

databases:
  - name: afrikcse-afrikvoyage
    databaseName: afrikcse-afrikvoyage
    user: afrikcse_user
    region: frankfurt
    plan: free